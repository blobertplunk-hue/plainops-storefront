<div class="top"><div><div class="eyebrow">Amplify Desmos Math Texas · Unit 1 · Lesson 14</div><div class="title">Getting in Order</div><div class="sub">Compare and order fractions using strategies that make sense. Work with a partner until Show What You Know.</div></div><div class="tools"><button class="tool" id="readBtn" type="button">Read aloud</button><button class="tool" id="soundBtn" type="button">Sound: On</button><button class="tool" id="resetBtn" type="button">Reset</button></div></div>
<div class="hud"><div class="bar" aria-label="lesson progress"><i id="progress"></i></div><div class="pill">Mission <b id="mission">1/5</b></div><div class="pill">Score <b id="score">0</b></div><div class="pill">Mode <b id="mode">Partner</b></div></div>
<main class="lessonCard" id="card"></main><div class="footerline">Local-only progress · no names, accounts, or network connection required.</div></div>
<script>const DATA={"title": "Lesson 14: Getting in Order", "partner": "Choose a partner. Work with a partner from the start. Choose your partner.", "sequence": [{"id": "warmup", "label": "Warm-Up", "body": "Notice and Wonder about three unlabeled number lines with flippers that allow a ball to travel to a star. Share what you notice and wonder.", "assessment": false}, {"id": "activity1", "label": "Activity 1", "body": "Put Them in Order. Work with your partner to order fractions from least to greatest using a strategy that makes sense. Source examples include 1/8, 3/12, 1/2 and 5/6, 11/10, 8/5. Explain how you compared them.", "assessment": false}, {"id": "activity2", "label": "Activity 2", "body": "Which Is the Greatest? Use the Lesson 14 fraction-card set. Reveal cards one at a time and place four fractions from least to greatest; once a card is placed, do not move it. Discard a card if it cannot fit. Discuss how you decided where each fraction belongs.", "assessment": false}, {"id": "synthesis", "label": "Synthesis", "body": "Review the strategies used to compare and order fractions: visual models, benchmark numbers, and equivalent fractions with common numerators or denominators. Explain which strategy worked best for a pair and why.", "assessment": false}, {"id": "swyk", "label": "SWYK", "body": "Complete Show What You Know 1.14 independently: compare 3/10 and 2/6; compare 99/100 and 9/10; then order 5/12, 8/6, 4/10, and 7/5 from least to greatest. Show your thinking.", "assessment": true}], "activity1_sets": [["1/8", "3/12", "1/2"], ["5/6", "11/10", "8/5"]], "activity2_cards": ["2/4", "12/12", "1/5", "13/8", "4/6", "3/8", "9/5", "10/12", "150/100", "5/4"], "swyk": {"compare_pairs": [["3/10", "2/6"], ["99/100", "9/10"]], "order_set": ["5/12", "8/6", "4/10", "7/5"]}};
(function(){
const KEY='fractionFaceOff_u1l14_v1',STATE_VERSION=1,card=document.getElementById('card'),progress=document.getElementById('progress'),mission=document.getElementById('mission'),scoreEl=document.getElementById('score'),modeEl=document.getElementById('mode');
const fresh=()=>({version:STATE_VERSION,step:0,score:0,sound:true,warm:{notice:'',wonder:''},a1:{round:0,picks:[]},a2:{deck:[...DATA.activity2_cards],current:null,slots:[null,null,null,null],discarded:[]},synthesis:{strategies:[],text:''},swyk:{q1:'',q2:'',order:[],thinking:''}});let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===STATE_VERSION)state=Object.assign(fresh(),saved)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function fracValue(f){const p=String(f).split('/').map(Number);return p.length===2&&p[1]?p[0]/p[1]:Number(f)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let audioCtx=null;function tone(ok){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx||audioCtx.state==='closed')audioCtx=new C();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=ok?660:220;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.09)}catch(e){}}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function update(){mission.textContent=(Math.min(state.step+1,5))+'/5';scoreEl.textContent=state.score;modeEl.textContent=state.step===4?'Independent':'Partner';progress.style.width=(Math.min(state.step,5)/5*100)+'%';document.getElementById('soundBtn').textContent='Sound: '+(state.sound?'On':'Off')}
function shell(phase,title,prompt,assessment){card.className='lessonCard'+(assessment?' assessment':'');card.innerHTML='<div class="phase">'+esc(phase)+'</div><h2>'+esc(title)+'</h2><div class="prompt" id="promptText">'+esc(prompt)+'</div><div id="stage"></div><div class="feedback" id="fb" role="status" aria-live="polite" aria-atomic="true">'+(assessment?'Work independently. No hints or answers are provided.':'Plan, test, revise, and explain your thinking.')+'</div>';return document.getElementById('stage')}
function fb(msg,kind){const f=document.getElementById('fb');if(!f)return;f.className='feedback'+(kind?' '+kind:'');f.textContent=msg}
function next(){state.step++;save();render()}
function warmup(){const s=shell('Warm-Up','Notice and Wonder',DATA.sequence[0].body,false);s.innerHTML='<div class="noticeGrid">'+[1,2,3].map((n,i)=>'<div class="miniLine"><svg viewBox="0 0 240 82" role="img" aria-label="unlabeled number line '+n+' with a ball, flippers, and star"><line x1="16" y1="44" x2="224" y2="44" stroke="#b7d4f6" stroke-width="4"/><circle cx="30" cy="44" r="8" fill="#ffd36a"/><path d="M'+(78+i*10)+' 52 l18 -18 M'+(126+i*6)+' 52 l18 -18" stroke="#6eb6ff" stroke-width="6" stroke-linecap="round"/><text x="202" y="34" fill="#4dd6a7" font-size="24">★</text></svg></div>').join('')+'</div><div class="responseGrid"><label class="field">I notice<textarea id="notice" placeholder="What do you notice?">'+esc(state.warm.notice)+'</textarea></label><label class="field">I wonder<textarea id="wonder" placeholder="What do you wonder?">'+esc(state.warm.wonder)+'</textarea></label></div><div class="actions"><button class="primary" type="button" id="warmNext">Continue</button></div>';const notice=document.getElementById('notice'),wonder=document.getElementById('wonder');[notice,wonder].forEach(el=>el.addEventListener('input',()=>{state.warm.notice=notice.value;state.warm.wonder=wonder.value;save()}));document.getElementById('warmNext').onclick=()=>{if(!(notice.value.trim()||wonder.value.trim())){fb('Add at least one notice or wonder before continuing.','bad');tone(false);return}tone(true);next()}}
function activity1(){const s=shell('Activity 1','Put Them in Order',DATA.sequence[1].body,false);const set=DATA.activity1_sets[state.a1.round]||DATA.activity1_sets[0];s.innerHTML='<div class="sourcebox"><strong>'+esc(DATA.partner)+'</strong> Tap fractions in least-to-greatest order. You can clear and try again.</div><div class="fractionBank" id="bank"></div><div class="orderStrip" id="order" aria-label="your order"></div><div class="actions"><button class="secondary" type="button" id="clearOrder">Clear</button><button class="primary" type="button" id="checkOrder">Check order</button></div>';function draw(){const bank=document.getElementById('bank'),order=document.getElementById('order');bank.innerHTML='';set.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='frac'+(state.a1.picks.includes(f)?' used':'');b.textContent=f;b.addEventListener('click',()=>orderPick(f));bank.appendChild(b)});order.innerHTML=state.a1.picks.map(f=>'<span class="orderChip">'+esc(f)+'</span>').join('')||'<span class="sub">Your ordered fractions appear here.</span>'}window.orderPick=function(f){if(!state.a1.picks.includes(f)){state.a1.picks.push(f);save();draw()}};document.getElementById('clearOrder').onclick=()=>{state.a1.picks=[];save();draw()};document.getElementById('checkOrder').onclick=()=>{if(state.a1.picks.length!==set.length){fb('Place every fraction before checking.','bad');tone(false);return}const vals=state.a1.picks.map(fracValue),ok=vals.every((v,i)=>!i||vals[i-1]<=v);if(!ok){fb('Not yet. Compare the fractions again and revise your order.','bad');tone(false);return}state.score+=100;tone(true);if(state.a1.round+1<DATA.activity1_sets.length){state.a1.round++;state.a1.picks=[];save();fb('Correct. Try the second set.','good');setTimeout(render,500)}else{save();fb('Both sets are in order. Explain your strategy to your partner.','good');setTimeout(next,650)}};draw()}
function activity2(){const s=shell('Activity 2','Which Is the Greatest?',DATA.sequence[2].body,false);s.innerHTML='<div class="sourcebox">Cards come from the Lesson 1.14 Activity 2 fraction-card set. Reveal one card at a time. Once placed, a card cannot move. Discard a card if it cannot fit.</div><div class="gameGrid"><div class="deck"><h3>Fraction deck</h3><div class="currentCard" id="currentCard">?</div><button class="cardBtn" type="button" id="reveal">Reveal next card</button><button class="secondary" type="button" id="discard">Discard current card</button><p class="discarded" id="discarded"></p></div><div class="board"><h3>Least → Greatest</h3><div class="slots" id="slots"></div></div></div><div class="actions"><button class="primary" type="button" id="a2Next" disabled>Continue to Synthesis</button></div>';function renderGame(){document.getElementById('currentCard').textContent=state.a2.current||'?';const slots=document.getElementById('slots');slots.innerHTML='';state.a2.slots.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='slot'+(v?' filled':'');b.textContent=v||('Slot '+(i+1));b.disabled=!!v||!state.a2.current;b.addEventListener('click',()=>placeCard(i));slots.appendChild(b)});document.getElementById('discarded').textContent=state.a2.discarded.length?'Discarded: '+state.a2.discarded.join(', '):'No cards discarded yet.';document.getElementById('a2Next').disabled=state.a2.slots.some(v=>!v)}window.revealCard=function(){if(state.a2.current){fb('Place or discard the current card first.','bad');return}if(!state.a2.deck.length){fb('No cards remain. Use the cards already placed.','bad');return}state.a2.current=state.a2.deck.shift();save();renderGame()};window.placeCard=function(i){if(!state.a2.current||state.a2.slots[i])return;const trial=[...state.a2.slots];trial[i]=state.a2.current;const placed=trial.map(v=>v?fracValue(v):null).filter(v=>v!==null);const ok=placed.every((v,k)=>!k||placed[k-1]<=v);if(!ok){fb('That position would break least-to-greatest order. Try another open slot or discard the card.','bad');tone(false);return}state.a2.slots[i]=state.a2.current;state.a2.current=null;state.score+=50;save();tone(true);fb('Placed. That card is locked in position.','good');renderGame()};document.getElementById('reveal').onclick=revealCard;document.getElementById('discard').onclick=()=>{if(!state.a2.current){fb('Reveal a card first.','bad');return}state.a2.discarded.push(state.a2.current);state.a2.current=null;save();renderGame()};document.getElementById('a2Next').onclick=()=>{tone(true);next()};renderGame()}
function synthesis(){const s=shell('Synthesis','Which strategies helped?',DATA.sequence[3].body,false);const strategies=['Visual models','Benchmark numbers','Equivalent fractions with common numerators','Equivalent fractions with common denominators'];s.innerHTML='<div class="strategyGrid">'+strategies.map(x=>'<label><input type="checkbox" value="'+esc(x)+'" '+(state.synthesis.strategies.includes(x)?'checked':'')+'> '+esc(x)+'</label>').join('')+'</div><label class="field">Which strategy worked best for a pair, and why?<textarea id="synthesisText" placeholder="Explain your reasoning.">'+esc(state.synthesis.text)+'</textarea></label><div class="actions"><button class="primary" type="button" id="synNext">Continue to independent SWYK</button></div>';const boxes=[...s.querySelectorAll('input[type=checkbox]')],txt=document.getElementById('synthesisText');boxes.forEach(b=>b.addEventListener('change',()=>{state.synthesis.strategies=boxes.filter(x=>x.checked).map(x=>x.value);save()}));txt.addEventListener('input',()=>{state.synthesis.text=txt.value;save()});document.getElementById('synNext').onclick=()=>{if(!state.synthesis.strategies.length||txt.value.trim().length<8){fb('Choose at least one strategy and explain why it helped.','bad');tone(false);return}tone(true);next()}}
function swyk(){const s=shell('Show What You Know','Work independently',DATA.sequence[4].body,true);const pair=DATA.swyk.compare_pairs,order=DATA.swyk.order_set;s.innerHTML='<div class="swykGrid"><div class="question"><strong>1.</strong> Circle the greater fraction.<div class="choices">'+pair[0].map(f=>'<label><input type="radio" name="q1" value="'+esc(f)+'" '+(state.swyk.q1===f?'checked':'')+'> '+esc(f)+'</label>').join('')+'</div></div><div class="question"><strong>2.</strong> Circle the greater fraction.<div class="choices">'+pair[1].map(f=>'<label><input type="radio" name="q2" value="'+esc(f)+'" '+(state.swyk.q2===f?'checked':'')+'> '+esc(f)+'</label>').join('')+'</div></div><div class="question"><strong>3.</strong> Order from least to greatest.<div class="fractionBank" id="swykBank"></div><div class="orderStrip" id="swykOrder"></div><button class="secondary" type="button" id="clearSwyk">Clear order</button></div><label class="field">Show your thinking<textarea id="swykResponse" placeholder="Explain how you compared or ordered the fractions.">'+esc(state.swyk.thinking)+'</textarea></label></div><div class="actions"><button class="primary" type="button" id="finishLesson">Finish lesson</button></div>';s.querySelectorAll('input[name=q1]').forEach(x=>x.addEventListener('change',()=>{state.swyk.q1=x.value;save()}));s.querySelectorAll('input[name=q2]').forEach(x=>x.addEventListener('change',()=>{state.swyk.q2=x.value;save()}));const t=document.getElementById('swykResponse');t.addEventListener('input',()=>{state.swyk.thinking=t.value;save()});function drawOrder(){const bank=document.getElementById('swykBank'),out=document.getElementById('swykOrder');bank.innerHTML='';order.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='frac'+(state.swyk.order.includes(f)?' used':'');b.textContent=f;b.addEventListener('click',()=>{if(!state.swyk.order.includes(f)){state.swyk.order.push(f);save();drawOrder()}});bank.appendChild(b)});out.innerHTML=state.swyk.order.map(f=>'<span class="orderChip">'+esc(f)+'</span>').join('')||'<span class="sub">Tap all four fractions in your order.</span>'}document.getElementById('clearSwyk').onclick=()=>{state.swyk.order=[];save();drawOrder()};document.getElementById('finishLesson').onclick=()=>{if(!state.swyk.q1||!state.swyk.q2||state.swyk.order.length!==order.length||t.value.trim().length<3){fb('Complete all three problems and show your thinking before finishing.','bad');tone(false);return}tone(true);next()};drawOrder()}
function finish(){card.className='lessonCard';card.innerHTML='<div class="finish"><div><div class="big">✓</div><h2>Lesson complete</h2><p>You compared and ordered fractions using several strategies.</p><p class="sub">Your progress is saved only in this browser. Return to the start page and mark Math done.</p><button class="secondary" type="button" id="restart">Practice again</button></div></div>';document.getElementById('restart').onclick=()=>{state=fresh();save();render()}}
function render(){update();if(state.step===0)warmup();else if(state.step===1)activity1();else if(state.step===2)activity2();else if(state.step===3)synthesis();else if(state.step===4)swyk();else finish();update()}
document.getElementById('soundBtn').onclick=()=>{state.sound=!state.sound;save();update()};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset this lesson on this device?')){state=fresh();save();render()}};document.getElementById('readBtn').onclick=()=>{const p=document.getElementById('promptText');if(p)speak(p.textContent)};render();
})();</script></body></html>
